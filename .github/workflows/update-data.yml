name: Update Themes ETFs data

on:
  # Weekly refresh every Sunday at 00:00 UTC, plus manual runs.
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Batch size; empty or 0 processes the full catalog, otherwise resumes after the saved cursor"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between outgoing request starts in each worker lane"
        required: false
        default: ""
        type: string
      concurrency:
        description: "Parallel fund workers; keep low and polite"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request for retryable failures"
        required: false
        default: ""
        type: string
      tickers:
        description: "Only update these tickers, separated by spaces or commas"
        required: false
        default: ""
        type: string
      category:
        description: "Only funds whose official Themes catalog category contains this text"
        required: false
        default: ""
        type: string
      aum:
        description: "AUM min:max; amounts may use K/M/B/T suffixes or nano/micro/small/mid/large presets"
        required: false
        default: ""
        type: string
      ter:
        description: "Expense-ratio percentage range: min:max"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Derived Yahoo dividend-yield percentage range: min:max"
        required: false
        default: ""
        type: string
      sec_yield:
        description: "SEC-yield percentage range: min:max (currently no provider values)"
        required: false
        default: ""
        type: string
      performance_ytd:
        description: "Derived YTD performance range: min:max"
        required: false
        default: ""
        type: string
      performance_1y:
        description: "Derived 1-year performance range: min:max"
        required: false
        default: ""
        type: string
      performance_3y:
        description: "Derived 3-year performance range: min:max"
        required: false
        default: ""
        type: string
      performance_5y:
        description: "Derived 5-year performance range: min:max"
        required: false
        default: ""
        type: string
      performance_10y:
        description: "Derived 10-year performance range: min:max"
        required: false
        default: ""
        type: string
      total_return_ytd:
        description: "Derived YTD total-return range: min:max"
        required: false
        default: ""
        type: string
      total_return_1y:
        description: "Derived 1-year total-return range: min:max"
        required: false
        default: ""
        type: string
      total_return_3y:
        description: "Derived 3-year total-return range: min:max"
        required: false
        default: ""
        type: string
      total_return_5y:
        description: "Derived 5-year total-return range: min:max"
        required: false
        default: ""
        type: string
      total_return_10y:
        description: "Derived 10-year total-return range: min:max"
        required: false
        default: ""
        type: string
      holdings_page_size:
        description: "Rows in each generated holdings JSON page"
        required: false
        default: ""
        type: string
      history_page_size:
        description: "Rows in each generated history JSON page"
        required: false
        default: ""
        type: string
      history_range:
        description: "Yahoo history range control (the feed uses its stable all-history chart endpoint)"
        required: false
        default: ""
        type: string
      edgar_fallback:
        description: "Use matched SEC N-PORT-P holdings when an official CSV is unavailable"
        required: false
        default: ""
        type: string
      skip_yahoo:
        description: "Retain existing Yahoo history/dividend data while refreshing official sources"
        required: false
        default: ""
        type: string
      skip_themes:
        description: "Retain existing Themes catalog/holdings data while skipping the official source"
        required: false
        default: ""
        type: string
      sec_ua:
        description: "Optional declared SEC User-Agent contact string; never store credentials here"
        required: false
        default: ""
        type: string
      verbose:
        description: "Print retry and fallback notices (true/false)"
        required: false
        default: ""
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAX_FETCHES: ${{ inputs.max_fetches || '' }}
      REQUEST_SLEEP: ${{ inputs.request_sleep || '' }}
      CONCURRENCY: ${{ inputs.concurrency || '' }}
      MAX_RETRIES: ${{ inputs.max_retries || '' }}
      TICKERS: ${{ inputs.tickers || '' }}
      CATEGORY: ${{ inputs.category || '' }}
      AUM: ${{ inputs.aum || '' }}
      TER: ${{ inputs.ter || '' }}
      DIVIDEND_YIELD: ${{ inputs.dividend_yield || '' }}
      SEC_YIELD: ${{ inputs.sec_yield || '' }}
      PERFORMANCE_YTD: ${{ inputs.performance_ytd || '' }}
      PERFORMANCE_1Y: ${{ inputs.performance_1y || '' }}
      PERFORMANCE_3Y: ${{ inputs.performance_3y || '' }}
      PERFORMANCE_5Y: ${{ inputs.performance_5y || '' }}
      PERFORMANCE_10Y: ${{ inputs.performance_10y || '' }}
      TOTAL_RETURN_YTD: ${{ inputs.total_return_ytd || '' }}
      TOTAL_RETURN_1Y: ${{ inputs.total_return_1y || '' }}
      TOTAL_RETURN_3Y: ${{ inputs.total_return_3y || '' }}
      TOTAL_RETURN_5Y: ${{ inputs.total_return_5y || '' }}
      TOTAL_RETURN_10Y: ${{ inputs.total_return_10y || '' }}
      HOLDINGS_PAGE_SIZE: ${{ inputs.holdings_page_size || '' }}
      HISTORY_PAGE_SIZE: ${{ inputs.history_page_size || '' }}
      HISTORY_RANGE: ${{ inputs.history_range || '' }}
      EDGAR_FALLBACK: ${{ inputs.edgar_fallback || '' }}
      SKIP_YAHOO: ${{ inputs.skip_yahoo || '' }}
      SKIP_THEMES: ${{ inputs.skip_themes || '' }}
      SEC_UA: ${{ inputs.sec_ua || '' }}
      VERBOSE: ${{ inputs.verbose || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run updater unit tests
        run: bun test scripts/update-data.test.ts

      - name: Run client parity tests
        run: bun test scripts/ui-parity.test.ts

      - name: Generate api/themes static data
        run: bun ./scripts/update-data.ts

      # A data refresh may commit only the generated static feed.
      - name: Commit updated data
        run: |
          if git diff --quiet -- api/themes; then
            echo "api/themes is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/themes
          git commit -m "chore(data): update Themes ETF data"
          git push
